# spacetime-db-ha on K3s/K8s — 3-node cluster
#
# Usage:
#   kubectl apply -f spacetime-db-ha.yaml
#
# This creates:
#   - StatefulSet with 3 pods (each running spacetime-db-ha + SpacetimeDB)
#   - Headless service for Raft peer discovery
#   - LoadBalancer service for client connections
#
# Connect your SpacetimeDB client to the LoadBalancer IP on port 3001.

---
# Headless service for stable DNS names used by Raft
apiVersion: v1
kind: Service
metadata:
  name: spacetime-db-ha-raft
  labels:
    app: spacetime-db-ha
spec:
  clusterIP: None
  selector:
    app: spacetime-db-ha
  ports:
    - port: 4001
      name: raft

---
# Client-facing service
apiVersion: v1
kind: Service
metadata:
  name: spacetime-db-ha
  labels:
    app: spacetime-db-ha
spec:
  type: LoadBalancer
  selector:
    app: spacetime-db-ha
  ports:
    - port: 3001
      name: ws
      targetPort: 3001

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spacetime-db-ha
spec:
  serviceName: spacetime-db-ha-raft
  replicas: 3
  selector:
    matchLabels:
      app: spacetime-db-ha
  template:
    metadata:
      labels:
        app: spacetime-db-ha
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        # spacetime-db-ha proxy
        - name: spacetime-db-ha
          image: ghcr.io/webc-fork/spacetime-db-ha:latest
          ports:
            - containerPort: 3001
              name: ws
            - containerPort: 4001
              name: raft
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPACETIME_DB_HA_NODE_ID
              value: "$(POD_NAME)"
            - name: SPACETIME_DB_HA_LISTEN_ADDR
              value: "0.0.0.0:3001"
            - name: SPACETIME_DB_HA_RAFT_ADDR
              value: "0.0.0.0:4001"
            - name: SPACETIME_DB_HA_STDB_URL
              value: "ws://127.0.0.1:3000"
            - name: SPACETIME_DB_HA_PEERS
              value: "spacetime-db-ha-0.spacetime-db-ha-raft:4001,spacetime-db-ha-1.spacetime-db-ha-raft:4001,spacetime-db-ha-2.spacetime-db-ha-raft:4001"
            - name: SPACETIME_DB_HA_DATA_DIR
              value: "/data/raft"
          volumeMounts:
            - name: raft-data
              mountPath: /data/raft
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /cluster/health
              port: 4001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /cluster/health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 2

        # SpacetimeDB sidecar
        - name: spacetimedb
          image: clockworklabs/spacetime:latest
          command:
            - spacetimedb-standalone
            - start
            - --listen-addr
            - "0.0.0.0:3000"
          ports:
            - containerPort: 3000
              name: stdb
          volumeMounts:
            - name: stdb-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi

  volumeClaimTemplates:
    - metadata:
        name: raft-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: stdb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
