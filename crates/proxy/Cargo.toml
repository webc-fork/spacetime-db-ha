[package]
name = "spacetime-db-ha"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Distributed fault-tolerant proxy for SpacetimeDB using Raft consensus"
repository.workspace = true
[[bin]]
name = "spacetime-db-ha"
path = "src/main.rs"

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
parking_lot = "0.13.0"
thiserror.workspace = true
zenoh = { version = "1.10.2", default-features = false, features = ["transport_udp", "transport_quic", "transport_quic_datagram"] }
gxhash = "3.5.0"
fjall = "3.1.13"
crossfire = "3.1.22"
zmij = "1.0.23"
itoa = "1.0.18"
bitcode = { version = "0.6.9", default-features = false, features = ["std", "derive"] }
bytes = "1"
openraft = { version = "0.10.0-alpha.37", default-features = false, features = ["single-threaded"] }
openraft-rt-compio = "0.10.0-alpha.37"
compio = { version = "0.19", features = ["macros", "time", "net", "io", "signal"] }
futures = "0.3"
see = "0.1"
rimalloc = { git = "https://github.com/moggedhedien/rimalloc.git", version = "0.1.0" }

[dev-dependencies]
tempfile = "3.27.0"
