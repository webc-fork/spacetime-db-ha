[package]
name = "spacetime-db-ha-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for managing spacetime-db-ha clusters"
repository.workspace = true

[[bin]]
name = "sdha"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
compio = { version = "0.19", features = ["macros"] }
const-str = "1.1.0"
clap_args = { version = "0.1.9", features = ["macro"] }
spacetime-db-ha = { version = "0.1.0", path = "../proxy" }
