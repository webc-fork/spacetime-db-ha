[workspace]
resolver = "3"
members = ["crates/proxy", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/webc-fork/spacetime-db-ha"

[workspace.dependencies]

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"


[profile.release]
lto = true
codegen-units = 1
strip = true
